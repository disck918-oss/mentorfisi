<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MentorFISI</title>
<style>
:root{--ink:#1d1b1e;--mute:#5d5a60;--bg:#f3f4f6;--panel:#fff;--line:#d9dbe0;--red:#7d1d2f;--ok:#1f6b4a}
@media (prefers-color-scheme:dark){:root{--ink:#eceaee;--mute:#a8a5ad;--bg:#16151a;--panel:#201f26;--line:#383640;--red:#d98a98;--ok:#7fd1a5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}
h1{font:700 2rem/1.1 Georgia,serif;color:var(--red);margin:8px 0 4px}h2{font:700 1.25rem Georgia,serif;margin:0 0 12px}
p.sub{color:var(--mute);margin:0 0 24px}p.sub a{color:var(--red)}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:20px}
label{display:block;font-weight:600;margin:14px 0 4px}
input[type=text],input[type=date],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.grid label{font-weight:400;margin:0;border:1px solid var(--line);border-radius:4px;padding:6px 2px;text-align:center;font-size:.8rem;cursor:pointer}
.grid input{position:absolute;opacity:0}.grid label:has(input:checked){background:var(--red);color:#fff;border-color:var(--red)}
.grid label:has(input:focus-visible),button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.chk{font-weight:400;display:flex;gap:8px;margin:14px 0}
button{margin-top:16px;padding:10px 18px;border:0;border-radius:4px;background:var(--red);color:#fff;font:600 1rem system-ui;cursor:pointer}
button.sec{margin:0 0 0 auto;background:none;color:var(--red);border:1px solid var(--red);padding:6px 12px}
.msg{margin-top:12px;min-height:1.4em;color:var(--mute)}.msg.ok{color:var(--ok)}
.res{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:center}.res small{color:var(--mute)}
.slots{display:flex;flex-direction:column;gap:6px;margin-left:auto}.slots button.sec{margin:0}
</style></head><body><main>
<h1>MentorFISI</h1>
<p class="sub">Encuentra a un estudiante avanzado que te ayude en tu curso. Prototipo del piloto: no uses datos académicos reales.</p>

<section id="regsec"><h2>1. Regístrate</h2>
<label for="role">Quiero ser</label>
<select id="role"><option value="mentee">Estudiante que busca apoyo</option><option value="mentor">Mentor voluntario</option></select>
<label for="name">Nombre o alias</label><input id="name" type="text" maxlength="80" autocomplete="off">
<div id="cwrap" hidden><label for="contact">Correo institucional</label><input id="contact" type="text" maxlength="120" autocomplete="off" placeholder="usuario@unmsm.edu.pe (solo lo ve la coordinación)"></div>
<label for="rcourse">Curso</label><select id="rcourse"></select>
<label>Horarios disponibles</label><div class="grid" id="rslots"></div>
<label for="rmod">Modalidad</label>
<select id="rmod"><option value="ambas">Presencial o virtual</option><option value="presencial">Presencial</option><option value="virtual">Virtual</option></select>
<label class="chk"><input type="checkbox" id="consent"> Acepto que mi alias, curso y horarios se usen solo para este piloto y se compartan con la otra persona de la sesión. Los indicadores se publican de forma agregada, y la IA solo recibe curso, horarios y modalidad. Si eres mentor, tu correo institucional lo verá solo la coordinación para verificar tu perfil.</label>
<button id="reg">Registrarme</button><div class="msg" id="rmsg"></div></section>

<section id="srchsec"><h2>2. Busca un mentor</h2>
<label for="scourse">Curso</label><select id="scourse"></select>
<label>Tus horarios</label><div class="grid" id="sslots"></div>
<label for="smod">Modalidad</label>
<select id="smod"><option value="ambas">Presencial o virtual</option><option value="presencial">Presencial</option><option value="virtual">Virtual</option></select>
<button id="find">Buscar mentores</button><div class="msg" id="smsg"></div><div id="out"></div></section>
<section id="inbox" hidden><h2>Solicitudes recibidas</h2><div class="msg" id="imsg"></div><div id="ilist"></div></section>
<section id="mine" hidden><h2>Mis solicitudes</h2><div class="msg" id="mmsg"></div><div id="mlist"></div></section>
<section id="prof" hidden><h2>Mi perfil de mentor</h2>
<label>Cursos que puedes apoyar</label><div id="pcourses"></div>
<label>Horarios disponibles</label><div class="grid" id="pslots"></div>
<label for="pmod">Modalidad</label>
<select id="pmod"><option value="ambas">Presencial o virtual</option><option value="presencial">Presencial</option><option value="virtual">Virtual</option></select>
<button id="psave">Guardar cambios</button><div class="msg" id="pmsg"></div></section>
</main>
<script>
const COURSES=['Matemática Básica','Cálculo I','Física I','Algoritmos y Programación','Estructuras de Datos'];
const SLOTS=[];for(const h of [14,16,18,20])for(const d of ['Lun','Mar','Mié','Jue','Vie'])SLOTS.push(`${d} ${h}:00`);
const $=id=>document.getElementById(id);let menteeCode=null;
for(const s of ['rcourse','scourse'])$(s).innerHTML=COURSES.map(c=>`<option>${c}</option>`).join('');
for(const g of ['rslots','sslots'])$(g).innerHTML=SLOTS.map(s=>`<label><input type="checkbox" value="${s}">${s}</label>`).join('');
const picked=g=>[...$(g).querySelectorAll('input:checked')].map(i=>i.value);
const post=async(u,b)=>{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');return d};
const say=(id,t,ok)=>{$(id).textContent=t;$(id).className='msg'+(ok?' ok':'')};
$('reg').onclick=async()=>{try{
  const d=await post('/api/register',{role:$('role').value,name:$('name').value,courses:[$('rcourse').value],slots:picked('rslots'),modality:$('rmod').value,consent:$('consent').checked,contact:$('contact').value});
  if($('role').value==='mentee')menteeCode=d.code;
  if(d.code){const m=$('role').value==='mentor',u=location.origin+(m?'/?m=':'/?e=')+d.code;$('rmsg').className='msg ok';$('rmsg').innerHTML='Listo. Guarda este enlace personal: '+(m?'es tu acceso para ver y responder solicitudes. Tu perfil aparecerá en las búsquedas cuando la coordinación lo apruebe. Para cambiar tus horarios o cursos usa este mismo enlace, sin registrarte de nuevo.':'es tu acceso para ver el estado de tus solicitudes y calificar las sesiones. Ahora busca un mentor abajo.')+' <a href="'+esc(u)+'">'+esc(u)+'</a>'}else say('rmsg','Listo.',true);
}catch(e){say('rmsg',e.message)}};
$('find').onclick=async()=>{try{
  say('smsg','Buscando…');$('out').innerHTML='';
  const {results}=await post('/api/recommend',{course:$('scourse').value,slots:picked('sslots'),modality:$('smod').value});
  if(!results.length)return say('smsg','Aún no hay mentores con esos horarios. Prueba con más horarios u otra modalidad.');
  say('smsg',results[0].ia?'Explicaciones generadas con IA; tú decides.':'Recomendaciones por reglas; tú decides.',true);
  $('out').innerHTML=results.map(r=>`<div class="res"><div><strong>${esc(r.name)}</strong><br><small>${esc(r.reason)}</small></div><div class="slots">${r.common.slice(0,4).map(s=>`<button class="sec" data-m="${r.id}" data-s="${esc(s)}">Solicitar ${esc(s)}</button>`).join('')}</div></div>`).join('');
  $('out').querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{
    if(!(ecode||menteeCode))return say('smsg','Regístrate primero como estudiante (paso 1).');
    await post('/api/request',{mentee_code:ecode||menteeCode,mentor_id:b.dataset.m,course:$('scourse').value,slot:b.dataset.s});
    b.disabled=true;b.textContent='Solicitud enviada';if(ecode)loadMine();
  }catch(e){say('smsg',e.message)}});
}catch(e){say('smsg',e.message)}};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const code=new URLSearchParams(location.search).get('m');
const DAYS={Lun:1,Mar:2,'Mié':3,Jue:4,Vie:5};
function nextDate(slot){const w=DAYS[slot.split(' ')[0]],d=new Date();for(let k=0;k<8&&d.getDay()!==w;k++)d.setDate(d.getDate()+1);return d.toLocaleDateString('en-CA')}
function fd(s){return new Date(s+'T12:00:00').toLocaleDateString('es-PE',{weekday:'short',day:'numeric',month:'short'})}
async function loadInbox(){try{
  const {items,approved}=await post('/api/inbox',{code});
  say('imsg',!approved?'Tu perfil está pendiente de aprobación: aún no apareces en las búsquedas.':items.length?'':'Aún no tienes solicitudes.');
  $('ilist').innerHTML=items.map(i=>{
    const info=esc(i.course)+' · '+esc(i.slot)+' · '+esc(i.status)+(i.session_date?' · '+esc(fd(i.session_date))+(i.session_place?' · '+esc(i.session_place):''):'');
    const act=i.status==='pendiente'?`<div class="slots"><input type="date" data-r="${i.id}" value="${nextDate(i.slot)}" min="${new Date().toLocaleDateString('en-CA')}"><input type="text" data-p="${i.id}" maxlength="120" placeholder="Lugar o enlace de la sesión"><button class="sec" data-r="${i.id}" data-a="confirmada">Aceptar</button><button class="sec" data-r="${i.id}" data-a="rechazada">Rechazar</button></div>`:'';
    return `<div class="res"><div><strong>${esc(i.mentee?.name||'Estudiante')}</strong><br><small>${info}</small></div>${act}</div>`}).join('');
  $('ilist').querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{
    const id=b.dataset.r,acc=b.dataset.a==='confirmada';
    const date=$('ilist').querySelector(`input[data-r="${id}"]`).value,place=$('ilist').querySelector(`input[data-p="${id}"]`).value.trim();
    if(acc&&(!date||!place))return say('imsg','Para aceptar, indica la fecha y el lugar o enlace de la sesión.');
    await post('/api/respond',{code,request_id:id,action:b.dataset.a,date:acc?date:undefined,place:acc?place:undefined});loadInbox();
  }catch(e){say('imsg',e.message)}});
}catch(e){say('imsg',e.message)}}
if(code){$('inbox').hidden=false;$('prof').hidden=false;loadInbox();loadProfile()}
const ecode=new URLSearchParams(location.search).get('e');
async function loadMine(){try{
  const {items,today}=await post('/api/mine',{code:ecode});
  say('mmsg',items.length?'':'Aún no has enviado solicitudes.');
  $('mlist').innerHTML=items.map(i=>{
    const when=i.session_date?' · '+fd(i.session_date)+(i.session_place?' · '+i.session_place:''):'';
    const ready=i.status==='confirmada'&&i.session_done===null&&(!i.session_date||i.session_date<=today);
    const est=i.status==='pendiente'?'Esperando respuesta':i.status==='rechazada'?'Rechazada':i.session_done===null?(ready?'Aceptada: confirma si la sesión se realizó':'Aceptada: podrás calificar después de la sesión'):i.session_done?'Realizada · calificación '+i.rating:'No se realizó';
    const act=ready?`<div class="slots"><select data-r="${i.id}"><option value="">Calificar…</option><option value="5">5 · Muy buena</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1 · Mala</option></select><button class="sec" data-r="${i.id}" data-d="1">Se realizó</button><button class="sec" data-r="${i.id}" data-d="0">No se realizó</button></div>`:'';
    return `<div class="res"><div><strong>${esc(i.mentor?.name||'Mentor')}</strong><br><small>${esc(i.course)} · ${esc(i.slot)}${esc(when)} · ${esc(est)}</small></div>${act}</div>`}).join('');
  $('mlist').querySelectorAll('button').forEach(b=>b.onclick=async()=>{try{
    const id=b.dataset.r,done=b.dataset.d==='1',rating=+$('mlist').querySelector(`select[data-r="${id}"]`).value;
    if(done&&!rating)return say('mmsg','Elige una calificación de 1 a 5 antes de confirmar.');
    await post('/api/feedback',{code:ecode,request_id:id,done,rating:done?rating:null});loadMine();
  }catch(e){say('mmsg',e.message)}});
}catch(e){say('mmsg',e.message)}}
if(ecode){$('mine').hidden=false;loadMine()}
async function loadProfile(){try{
  const p=await post('/api/profile',{code,action:'get'});
  $('pcourses').innerHTML=COURSES.map(c=>`<label class="chk"><input type="checkbox" value="${esc(c)}"${p.courses.includes(c)?' checked':''}> ${esc(c)}</label>`).join('');
  $('pslots').innerHTML=SLOTS.map(s=>`<label><input type="checkbox" value="${s}"${p.slots.includes(s)?' checked':''}>${s}</label>`).join('');
  $('pmod').value=p.modality;
}catch(e){say('pmsg',e.message)}}
$('psave').onclick=async()=>{try{
  const r=await post('/api/profile',{code,action:'save',courses:picked('pcourses'),slots:picked('pslots'),modality:$('pmod').value});
  say('pmsg',r.reapproval?'Guardado. Agregaste cursos nuevos: tu perfil queda pendiente hasta que la coordinación los apruebe.':'Guardado.',true);
  loadInbox();
}catch(e){say('pmsg',e.message)}};
if(code||ecode){
  $('regsec').hidden=true;
  document.querySelector('p.sub').innerHTML=(code?'Panel del mentor':'Panel del estudiante')+' · <a href="/">Ir al inicio</a>';
  if(code)$('srchsec').hidden=true;else $('srchsec').querySelector('h2').textContent='Busca un mentor';
}
$('role').onchange=()=>{$('cwrap').hidden=$('role').value!=='mentor'};
</script></body></html>
